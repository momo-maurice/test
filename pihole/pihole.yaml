project: default
source:
  repoURL: https://mojo2600.github.io/pihole-kubernetes/
  targetRevision: 2.35.0
  helm:
    parameters:
      - name: DNS1
        value: 192.168.7.1
  chart: pihole
destination:
  server: https://kubernetes.default.svc
  namespace: pihole
syncPolicy:
  automated:
    prune: true
    selfHeal: true
    enabled: true
  syncOptions:
    - CreateNamespace=true