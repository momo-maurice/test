apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: esphome
spec:
  destination:
    namespace: esphome
    server: https://kubernetes.default.svc
  source:
    path: ''
    repoURL: https://charts.jeffresc.dev
    targetRevision: 0.1.10
    chart: esphome
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
      enabled: true
