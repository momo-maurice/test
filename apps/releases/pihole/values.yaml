admin:
  # Must exist in the 'pihole' namespace before Argo CD syncs
  existingSecret: pihole-admin-secret
  existingSecretKey: password

pihole:
  timezone: "Europe/Amsterdam"
  # Required for Kubernetes environments
  listeningMode: ALL
  # Public DNS servers for all non-local domains (semicolon-delimited)
  upstreamDns: "1.1.1.1;9.9.9.9"
  dnssec: true

# Disable Unbound since you are using public upstream DNS servers
unbound:
  enabled: false

dns:
  # Forward example.com and *.example.com to your local DNS at 192.168.1.1
  customDnsmasq:
    - "server=/orangemen.nl/192.168.7.1"
    # Optional: enable reverse DNS lookups for 192.168.1.x hostnames
    - "rev-server=192.168.7.0/24,192.168.7.1"

  # Optional: add blocklists (initialized before Pi-hole starts)
  adlists:
    - "https://githubusercontent.com"

gravity:
  updateOnInit: true

serviceDns:
  type: LoadBalancer
  # Optional: uncomment to pin a static IP via MetalLB/Cilium
  # loadBalancerIP: "192.168.1.53"
  externalTrafficPolicy: Local

serviceWeb:
  type: ClusterIP

persistence:
  enabled: true
  size: 2Gi
