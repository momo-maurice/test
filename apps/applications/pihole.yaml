apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: The HelmForge OCI chart
    - repoURL: ghcr.io/helmforgedev/helm
      chart: pihole
      targetRevision: 2.2.0 # Check HelmForge docs/ArtifactHub for exact latest version
      helm:
        releaseName: pihole
        valueFiles:
          - $values/apps/releases/pihole/values.yaml

    # Source 2: Your Git repository containing the values file
    - repoURL: https://github.com/momo-maurice/test.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: pihole

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
